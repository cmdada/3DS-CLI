name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: build-<sha>)'
        required: false
        type: string
      name:
        description: 'Release title (default: Build <short sha>)'
        required: false
        type: string

permissions:
  contents: write

jobs:

  # ── Buildroot: kernel Image + rootfs.ext2 ─────────────────────────────────
  buildroot:
    name: Build Linux (Buildroot RV32 Sv32 MMU)
    runs-on: ubuntu-latest

    env:
      # Also part of the images cache key below, so bumping this rebuilds
      # rather than restoring images built by the old version.
      BR_VER: 2024.02.9

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The kernel Image and rootfs are a pure function of the buildroot/
      # tree and the pinned Buildroot version: nothing under source/, and
      # nothing the devkitARM job does, feeds into them. So cache the
      # finished images against exactly that, and skip the whole build when
      # it hits. Most releases only touch the homebrew side, and those go
      # from a ~40 minute toolchain-plus-kernel-plus-rootfs build to a few
      # seconds of download for byte-identical output.
      #
      # Deliberately no restore-keys: a partial match here would hand the
      # release a kernel built from a *different* config, which is exactly
      # the mismatch that issue #5 was (an Image and an app that disagreed
      # about how much RAM the guest needs). Either the inputs hash the same
      # and the images are known-correct, or we rebuild.
      - name: Restore prebuilt Linux images
        id: images
        uses: actions/cache@v4
        with:
          path: release-linux
          key: linux-rv32-${{ env.BR_VER }}-${{ hashFiles('buildroot/**') }}

      - name: Install host dependencies
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc cpio file rsync unzip wget \
            libncurses-dev libssl-dev python3 bison flex \
            device-tree-compiler

      - name: Cache Buildroot downloads
        if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: buildroot-dl
          key: buildroot-dl-${{ hashFiles('buildroot/configs/3ds_defconfig') }}
          restore-keys: buildroot-dl-

      - name: Download Buildroot
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          wget -q "https://buildroot.org/downloads/buildroot-${BR_VER}.tar.gz"
          tar -xzf "buildroot-${BR_VER}.tar.gz"
          echo "BR_DIR=$(pwd)/buildroot-${BR_VER}" >> $GITHUB_ENV

      - name: Configure and build
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          cd "$BR_DIR"
          BR2_EXTERNAL="$(pwd)/../buildroot" \
            make BR2_DL_DIR="$(pwd)/../buildroot-dl" \
                 O="$(pwd)/../buildroot-output" \
                 3ds_defconfig
          cd ../buildroot-output
          make BR2_DL_DIR="$(pwd)/../buildroot-dl" -j$(nproc)

      - name: Stage release artifacts
        if: steps.images.outputs.cache-hit != 'true'
        run: |
          mkdir -p release-linux
          cp buildroot-output/images/Image        release-linux/Image
          cp buildroot-output/images/rootfs.ext4  release-linux/rootfs.ext2

      # Guards against a cache entry that restored but is missing or
      # truncated - the release would otherwise be published with a broken
      # Image and only fail on someone's console.
      - name: Verify Linux images
        run: |
          test -s release-linux/Image
          test -s release-linux/rootfs.ext2
          echo "source: ${{ steps.images.outputs.cache-hit == 'true' && 'cache' || 'built' }}"
          ls -l release-linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-rv32
          path: release-linux/
          retention-days: 1

  # ── devkitARM: 3dsx + CIA ─────────────────────────────────────────────────
  threeds:
    name: Build 3DS homebrew
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install curl for ARM
        run: dkp-pacman -S --noconfirm --needed 3ds-curl

      - name: Install CIA build tools
        run: |
          apt-get update && apt-get install -y wget build-essential zip unzip git cmake
          git clone --recursive https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool_src
          cd /tmp/bannertool_src && cmake -B build && cmake --build build
          cp /tmp/bannertool_src/build/bannertool /usr/local/bin/
          chmod +x /usr/local/bin/bannertool
          git clone https://github.com/3DSGuy/Project_CTR.git /tmp/Project_CTR
          cd /tmp/Project_CTR/makerom && make deps && make
          cp /tmp/Project_CTR/makerom/bin/makerom /usr/local/bin/
          chmod +x /usr/local/bin/makerom

      - name: Regenerate DTB header
        run: |
          apt-get install -y -qq device-tree-compiler
          python3 tools/gen_dtb.py

      - name: Build 3DSX and CIA
        run: make && make cia

      - name: Upload 3DS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threeds-homebrew
          path: |
            3ds-cli.3dsx
            3ds-cli.cia
          retention-days: 1

  # ── devkitPPC: Wii U (.rpx/.wuhb), Wii and GameCube (.dol) ────────────────
  #
  # One job for all three: they share a toolchain and a container, and the
  # whole point of the platform layer is that they share source/core too.
  powerpc:
    name: Build PowerPC homebrew
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Regenerate DTB header
        run: |
          apt-get update && apt-get install -y -qq device-tree-compiler python3
          python3 tools/gen_dtb.py

      # curl only matters to the Wii U build - see source/core/download.h -
      # but this job is also where the Wii and GameCube are built, and they
      # link neither.
      - name: Install zlib and curl for PowerPC
        run: dkp-pacman -S --noconfirm --needed ppc-zlib wiiu-curl

      - name: Build Wii U, Wii and GameCube
        run: make wiiu && make wii && make gamecube

      - name: Upload PowerPC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: powerpc-homebrew
          path: |
            dist/wiiu/3ds-cli.rpx
            dist/wiiu/3ds-cli.wuhb
            dist/wii/3ds-cli.dol
            dist/cube/3ds-cli.dol
          retention-days: 1

  # ── devkitA64: Switch (.nro) ──────────────────────────────────────────────
  switch:
    name: Build Switch homebrew
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Regenerate DTB header
        run: |
          apt-get update && apt-get install -y -qq device-tree-compiler python3
          python3 tools/gen_dtb.py

      - name: Install zlib and curl for AArch64
        run: dkp-pacman -S --noconfirm --needed switch-zlib switch-curl

      - name: Build NRO
        run: make switch

      - name: Upload Switch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switch-homebrew
          path: dist/switch/3ds-cli.nro
          retention-days: 1

  # ── pspdev: PSP (EBOOT.PBP) ───────────────────────────────────────────────
  # I may later make my own pspdev gh action :/ I don't love this one
  psp:
    name: Build PSP homebrew
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Regenerate DTB header
        run: |
          apk add --no-cache python3 dtc
          python3 tools/gen_dtb.py

      # zlib, curl and mbedTLS all ship in the pspdev image already, so
      # unlike the devkitPro jobs there is no portlib to install here.
      - name: Build EBOOT
        run: make psp

      - name: Upload PSP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psp-homebrew
          path: dist/psp/EBOOT.PBP
          retention-days: 1

  # ── VitaSDK: PS Vita (.vpk) ───────────────────────────────────────────────
  vita:
    name: Build Vita homebrew
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Regenerate DTB header
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 device-tree-compiler
          python3 tools/gen_dtb.py

      # The image carries the whole series, but curl ships in two flavours and
      # only the mbedTLS one matches the -lmbedtls line in mk/vita.mk, so name
      # it rather than trusting whichever was baked in.
      #
      # The baked-in one is the OpenSSL build, and the two packages share every
      # path without either declaring a conflict, so installing over it dies on
      # file conflicts instead of replacing it. Remove it first - along with cpr
      # and curlpp, which depend on it and which nothing here links.
      - name: Install portlibs
        run: |
          vdpm remove --noconfirm cpr curlpp curl
          vdpm install --noconfirm curl-mbedtls zlib

      - name: Build VPK
        run: make vita
        env:
          VITASDK: /usr/local/vitasdk

      - name: Upload Vita artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vita-homebrew
          path: dist/vita/3ds-cli.vpk
          retention-days: 1

  ps3:
    name: Build PS3 homebrew
    runs-on: ubuntu-latest
    # The only ps3dev image ever published, and it is from 2020. It is used
    # for the toolchain alone - ppu-gcc and the zlib portlib - because the
    # PSL1GHT that ships in it predates the four-argument rsxInit that
    # source/platform/ps3/plat.c calls, and carries the old Python packaging
    # scripts rather than the fself/sfo/pkg that ppu_rules now invokes. Both
    # are fixed by building PSL1GHT master below, rather than by pinning the
    # source to a five-year-old API.
    #
    # Deliberately no apt-get anywhere in this job: the image is Debian buster,
    # whose repositories have moved to archive, so an apt-get update is a
    # coin flip. Everything needed (git, make, a host compiler) is already in
    # it, and the DTB header is regenerated by the other jobs from the same
    # source/3ds-cli.dts.
    container: ps3dev/ps3dev:submodules

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # /usr/local/ps3dev is a VOLUME in the image, so anything installed over
      # it is not reliably visible afterwards. PSL1GHT gets its own prefix and
      # mk/ps3.mk is pointed at it; PS3DEV stays the image's, which is where
      # ppu-gcc and the portlibs live.
      #
      # The rules files have to be copied in before the build: PSL1GHT's own
      # makefiles include $(PSL1GHT)/ppu_rules, so it cannot bootstrap into an
      # empty prefix.
      - name: Build PSL1GHT from master
        env:
          PS3DEV: /usr/local/ps3dev
          PSL1GHT: /opt/psl1ght
        run: |
          set -eux
          git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git /tmp/psl1ght
          mkdir -p "$PSL1GHT/bin"
          cd /tmp/psl1ght
          cp -f ppu_rules base_rules data_rules spu_rules "$PSL1GHT/"
          make -j"$(nproc)"
          make install
          # ppu_rules calls fself, sfo and pkg by those names; the image only
          # has the older .py versions of them, so take master's.
          cd tools && make -j"$(nproc)"
          find . -maxdepth 2 -type f -perm -u+x -exec cp -f {} "$PSL1GHT/bin/" \; || true

      - name: Build SELF and PKG
        env:
          PS3DEV: /usr/local/ps3dev
          PSL1GHT: /opt/psl1ght
        run: |
          set -eux
          export PATH="/opt/psl1ght/bin:$PATH"
          make ps3
          make -f mk/ps3.mk pkg

      - name: Upload PS3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps3-homebrew
          path: |
            dist/ps3/3ds-cli.self
            dist/ps3/3ds-cli.pkg
          retention-days: 1

  # ── Package and release ───────────────────────────────────────────────────
  release:
    name: Package release
    needs: [buildroot, threeds, powerpc, switch, psp, vita, ps3]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-rv32
          path: release/

      - name: Download 3DS artifacts
        uses: actions/download-artifact@v4
        with:
          name: threeds-homebrew
          path: release/

      - name: Download PowerPC artifacts
        uses: actions/download-artifact@v4
        with:
          name: powerpc-homebrew
          path: release/ppc/

      - name: Download Switch artifacts
        uses: actions/download-artifact@v4
        with:
          name: switch-homebrew
          path: release/nx/

      - name: Download PSP artifacts
        uses: actions/download-artifact@v4
        with:
          name: psp-homebrew
          path: release/psp/

      - name: Download Vita artifacts
        uses: actions/download-artifact@v4
        with:
          name: vita-homebrew
          path: release/vita/

      - name: Download PS3 artifacts
        uses: actions/download-artifact@v4
        with:
          name: ps3-homebrew
          path: release/ps3/

      # upload-artifact strips the longest common prefix of the paths it was
      # given, so the layout inside an artifact is not the layout that was
      # uploaded. Print it: a mismatch here is otherwise a cp failure fifty
      # lines later with no clue why.
      - name: Show downloaded layout
        run: find release -type f | sort

      # The dispatch inputs are optional, so fall back to the commit-derived
      # tag and title when they are left blank.
      - name: Set release variables
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.name }}
        run: |
          short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          echo "tag=${INPUT_TAG:-build-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=${INPUT_NAME:-Build $short_sha}" >> "$GITHUB_OUTPUT"

      # Bundle the rootfs into the Image so the whole install is just the
      # 3dsx plus one Image file - the app inflates rootfs.ext2 to the SD
      # card on first boot and uses that writable copy from then on.
      - name: Bundle rootfs into Image
        run: |
          python3 tools/mkimage.py release/Image release/rootfs.ext2 release/Image-combined
          mv release/Image-combined release/Image
          rm release/rootfs.ext2

      # Every console keeps the 3ds-cli name, so the two .dol builds can only
      # be told apart by their directory - which is also the layout each
      # console's loader wants.
      - name: Package release ZIP
        run: |
          cd release
          mkdir -p out/3ds out/wiiu out/wii out/gamecube out/switch out/psp out/vita out/ps3
          cp 3ds-cli.3dsx 3ds-cli.cia   out/3ds/
          cp ppc/wiiu/3ds-cli.rpx ppc/wiiu/3ds-cli.wuhb out/wiiu/
          cp ppc/wii/3ds-cli.dol   out/wii/
          cp ppc/cube/3ds-cli.dol  out/gamecube/
          cp nx/3ds-cli.nro        out/switch/
          cp psp/EBOOT.PBP         out/psp/
          cp vita/3ds-cli.vpk      out/vita/
          cp ps3/3ds-cli.self ps3/3ds-cli.pkg out/ps3/
          cp Image                      out/
          cat > out/README_sdcard.txt <<'TXT'
          3DS-CLI - RISC-V Linux on Nintendo consoles.

          Copy `Image` to the root of the console's SD card, then the binary
          for your console. rootfs.ext2 is unpacked from Image on first boot
          and becomes the writable disk from then on.

            3DS       Image -> sdmc:/Image
                      3ds/3ds-cli.3dsx -> sdmc:/3ds/3ds-cli/3ds-cli.3dsx
            Wii U     Image -> sd:/Image
                      wiiu/3ds-cli.wuhb -> sd:/wiiu/apps/3ds-cli.wuhb
            Switch    Image -> sdmc:/Image
                      switch/3ds-cli.nro -> sdmc:/switch/3ds-cli.nro
            Wii       Image -> sd:/Image
                      wii/3ds-cli.dol -> sd:/apps/3ds-cli/boot.dol
            PSP       Image -> ms0:/Image
                      psp/EBOOT.PBP -> ms0:/PSP/GAME/3ds-cli/EBOOT.PBP
            PS Vita   Image -> ux0:/Image
                      vita/3ds-cli.vpk - install it with VitaShell
            PS3       ps3/3ds-cli.pkg - install it from the XMB, then
                      Image -> /dev_hdd0/3ds-cli/Image. There is no removable
                      card: copy it over FTP. Needs a display that can do
                      720p. ps3/3ds-cli.self is there for loaders that want
                      one instead of the .pkg.
            GameCube  needs an SD Gecko or SD2SP2 in slot A; a memory card
                      cannot hold the rootfs. Image -> carda:/Image
          TXT
          cd out && zip -r ../../3ds_cli.zip .

      # Store submissions want the app laid out the way each store installs
      # it, which is not the layout a person unzipping onto a card wants.
      # Built here so a release carries both, and a store entry can point
      # straight at a release asset.
      - name: Build store packages
        run: |
          cp -r release/ppc dist
          mkdir -p dist/switch
          cp release/nx/3ds-cli.nro dist/switch/
          VERSION="${{ steps.vars.outputs.tag }}" tools/package.sh release/Image

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            3ds_cli.zip
            release/Image
            dist/packages/oscwii-3ds-cli.zip
            dist/packages/hbas-wiiu-3ds-cli.zip
            dist/packages/hbas-switch-3ds-cli.zip
          make_latest: true
          body: |
            ## Install

            1. Download `3ds_cli.zip` below and extract it.
            2. Copy `Image` to the root of your SD card.
            3. Copy your console's file from the zip:

            | Console | Copy this | To here |
            |---|---|---|
            | 3DS | `3ds/3ds-cli.3dsx` | `sdmc:/3ds/3ds-cli/` |
            | Wii U | `wiiu/3ds-cli.wuhb` | `sd:/wiiu/apps/` |
            | Switch | `switch/3ds-cli.nro` | `sdmc:/switch/` |
            | Wii | `wii/3ds-cli.dol` | `sd:/apps/3ds-cli/boot.dol` |
            | PSP | `psp/EBOOT.PBP` | `ms0:/PSP/GAME/3ds-cli/` |
            | PS Vita | `vita/3ds-cli.vpk` | install with VitaShell |
            | GameCube | `gamecube/3ds-cli.dol` | anywhere Swiss can reach |
            | PS3 | `ps3/3ds-cli.pkg` | install it from the XMB |

            That's it. The other zips below are for the Open Shop Channel and
            the Homebrew App Store to install from, not for copying by hand.
