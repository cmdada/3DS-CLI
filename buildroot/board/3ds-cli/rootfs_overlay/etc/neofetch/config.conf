# neofetch config for 3DS-CLI
# Displays a 3DS-style ASCII art logo with key system info.

print_info() {
    info title
    info underline

    info "OS"         distro
    info "Kernel"     kernel
    info "Uptime"     uptime
    info "Shell"      shell
    info "Terminal"   term
    info "CPU"        cpu
    info "Memory"     memory

    info cols
}

# Minimal ASCII art: a simple 3DS outline
ascii_distro="auto"
ascii_colors=(4 5 6 7)
ascii_bold=true

image_backend="ascii"

# Keep it narrow for the 80-column terminal
gap=2
bold=on
underline_enabled=on
underline_char="-"

# Speed up by skipping slow lookups
speed_shorthand=on
cpu_speed=on
cpu_cores="logical"

# Memory in MiB
memory_unit="mib"
